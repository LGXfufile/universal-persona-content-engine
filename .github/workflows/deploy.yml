name: 🚀 Deploy UPCE to Vercel & GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 代码质量检查
  quality-check:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: 📋 Install dependencies
      run: npm ci
    
    - name: 🔧 Type check
      run: npx tsc --noEmit
      continue-on-error: true
    
    - name: 🧹 Lint check
      run: npm run lint
      continue-on-error: true

  # 构建项目
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📋 Install dependencies
      run: npm ci
      
    - name: 🏗️ Build project (Static Export)
      run: |
        export EXPORT_MODE=static
        npm run build
      
    - name: 📤 Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: ./out
        
    - name: 📄 Setup Pages
      uses: actions/configure-pages@v4
      
    - name: 📤 Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./out

  # 部署到GitHub Pages
  deploy-pages:
    name: 🌐 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 部署到Vercel
  deploy-vercel:
    name: ⚡ Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: 📋 Install dependencies
      run: npm ci
    
    - name: 🚀 Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./

  # 通知飞书
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-vercel]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
    - name: 📢 Send success notification
      if: needs.deploy-pages.result == 'success' || needs.deploy-vercel.result == 'success'
      run: |
        curl -X POST "https://open.feishu.cn/open-apis/bot/v2/hook/fd8c7806-5aca-4dbf-b621-8b3f1c271bbd" \
        -H "Content-Type: application/json" \
        -d '{
          "msg_type": "text",
          "content": {
            "text": "🎉 UPCE项目部署成功！\n\n📦 提交: ${{ github.sha }}\n👤 作者: ${{ github.actor }}\n🌐 GitHub Pages: https://lgxfufile.github.io/universal-persona-content-engine\n⚡ Vercel: https://universal-persona-content-engine.vercel.app\n\n谷歌长尾词监控"
          }
        }'
    
    - name: 📢 Send failure notification
      if: needs.deploy-pages.result == 'failure' || needs.deploy-vercel.result == 'failure'
      run: |
        curl -X POST "https://open.feishu.cn/open-apis/bot/v2/hook/fd8c7806-5aca-4dbf-b621-8b3f1c271bbd" \
        -H "Content-Type: application/json" \
        -d '{
          "msg_type": "text",
          "content": {
            "text": "❌ UPCE项目部署失败！\n\n📦 提交: ${{ github.sha }}\n👤 作者: ${{ github.actor }}\n🔗 查看日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n谷歌长尾词监控"
          }
        }'